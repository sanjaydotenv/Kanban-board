<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <main>
      <nav>
        <div class="left">KANBAN BOARD</div>
        <div class="right"><button>Add New Task</button></div>
      </nav>
      <section>
        <!-- Todo board div -->
        <div id="todo" class="board todo">
          <div class="board-header">
            <h4>TO DO</h4>
            <h4>0</h4>
          </div>

          <div draggable="true" class="task">
            <div class="task-dets">
              <h2>Task 1</h2>
              <p>Description task 1</p>
            </div>
            <button class="delete-btn">Delete</button>
          </div>
        </div>

        <!-- Progress board div -->
        <div id="progress" class="board progress">
          <div class="board-header">
            <h4>In Progress</h4>
            <h4>0</h4>
          </div>
        </div>

        <!-- complete board div -->
        <div id="complete" class="board complete">
          <div class="board-header">
            <h4>Completed</h4>
            <h4>0</h4>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
